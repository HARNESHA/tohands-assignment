name: Terraform Infra Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::826136930409:role/GitHubAction-AssumeRoleWithAction
  TF_VERSION: 1.6.6

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: iac/env/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- AWS AUTH ----------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- TERRAFORM SETUP ----------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ---------- INIT ----------
      - name: Terraform Init
        working-directory: iac/env/dev
        run: terraform init -backend-config=backend.config.hcl

      # ---------- VALIDATE ----------
      - name: Terraform Validate
        working-directory: iac/env/dev
        run: terraform validate

      # ---------- TERRAFORM FORMAT CHECK ----------
      - name: Terraform Fmt Check
        working-directory: iac/env/dev
        run: terraform fmt -check -recursive

      # ---------- INSTALL TFLINT ----------
      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Run tflint
        run: tflint --init && tflint

      # ---------- PLAN ----------
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file=../../vars/dev.terraform.tfvars \
            -out=tfplan

      # ---------- UPLOAD PLAN ARTIFACT ----------
      - name: Upload tfplan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: iac/env/dev/tfplan

      # ---------- APPLY (ONLY ON MANUAL OR MAIN MERGE) ----------
      - name: Terraform Apply
        if: |
          github.event.inputs.action == 'apply' ||
          github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

      # ---------- OUTPUT EXPORT ----------
      - name: Terraform Output
        if: |
          github.event.inputs.action == 'apply' ||
          github.ref == 'refs/heads/main'
        run: terraform output -json > terraform-output.json

      - name: Upload Terraform Outputs
        if: |
          github.event.inputs.action == 'apply' ||
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: iac/env/dev/terraform-output.json
