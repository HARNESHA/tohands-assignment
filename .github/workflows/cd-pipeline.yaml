name: CD-Pipeline
on:
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::826136930409:role/GitHubAction-AssumeRoleWithAction
  EKS_CLUSTER_NAME: assignment-cluster

jobs:
  deploy:
    name: deploy-to-eks
    runs-on: ubuntu-latest
    needs: update-helm-chart
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        
      - name: Setup EKS Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $EKS_CLUSTER_NAME \
            --region $AWS_REGION
          kubectl cluster-info

      - name: Deploy Helm chart to EKS
        run: | 
          helm upgrade --install application helm/app-platform -f helm/app-platform/values.yaml

