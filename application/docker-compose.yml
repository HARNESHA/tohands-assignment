services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: assignment_dev_db
      POSTGRES_PASSWORD: changethis
      POSTGRES_DB: assignmentdevdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

